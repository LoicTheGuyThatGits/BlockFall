# Render blueprint: https://render.com/docs/blueprint-spec
#
# A Web Service (not a Static Site) is required: multiplayer needs the
# WebSocket server in server/index.js, and Render's free web service tier
# does support WebSockets.
#
# Note the free instance sleeps after 15 minutes without inbound traffic and
# takes roughly a minute to wake. Rooms are held in memory, so a match in
# progress is lost while the instance sleeps. The client reconnects on its own
# once the server wakes.
services:
  - type: web
    name: blockfall
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production